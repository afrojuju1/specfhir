services:
  postgres:
    image: pgvector/pgvector:pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_USER: specfhir
      POSTGRES_DB: specfhir
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SPECFHIR_PORT:-55432}:5432"
    volumes:
      - ./.specfhir/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specfhir -d specfhir"]
      interval: 2s
      timeout: 3s
      retries: 30
