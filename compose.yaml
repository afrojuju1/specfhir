services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: specfhir
      POSTGRES_DB: specfhir
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SPECFHIR_PORT:-55432}:5432"
    volumes:
      - ./.specfhir/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specfhir -d specfhir"]
      interval: 2s
      timeout: 3s
      retries: 30
