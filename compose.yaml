services:
  postgres:
    image: pgvector/pgvector:pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_USER: specfhir
      POSTGRES_DB: specfhir
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SPECFHIR_PORT:-55432}:5432"
    volumes:
      - ./.specfhir/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specfhir -d specfhir"]
      interval: 2s
      timeout: 3s
      retries: 30

  validator:
    build: ./validator-service
    image: specfhir-validator:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    ports:
      - "127.0.0.1:${SPECFHIR_VALIDATOR_PORT:-55433}:8080"
    volumes:
      - ./.specfhir/validator-service:/snapshots:ro
      - /cache
    tmpfs:
      - /work:uid=10001,gid=10001,mode=0700,size=64m
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app:/app/validator.jar", "Server", "health"]
      interval: 10s
      timeout: 5s
      start_period: 150s
      retries: 3

  validator-online:
    extends: validator
    profiles: [online]
    ports: !override
      - "127.0.0.1:${SPECFHIR_VALIDATOR_ONLINE_PORT:-55434}:8080"
    environment:
      TERMINOLOGY_ENDPOINT: ${SPECFHIR_TERMINOLOGY_ENDPOINT:-}
      REQUIRE_ONLINE: "true"
